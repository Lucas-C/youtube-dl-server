<!DOCTYPE html>
<html lang="en" class="h-100">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Web frontend for yt-dlp" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: #002b36;
      }
      .loader {
        max-width: 20%
      }
    </style>
    <title>youtube-dl</title>
    <link rel="icon" href="../../favicon.ico">
    {% if ROBOTS_NOINDEX %}
    <meta name="robots" content="noindex">
    {% endif %}
  </head>

  <body class="d-flex h-100 text-center text-white">
    <div class="container d-flex w-100 p-3 flex-column">
      <main class="px-3">
        <h1 class="display-4">youtube-dl</h1>
        <div id="initial">
          <img class="loader" src="static/loader.gif">
          <p class="lead">Your video / song is being downloaded</p>
        </div>
        <p id="success" class="lead" style="display: none">Your video / song can be downloaded:
          <a href="static/{{generated_file}}" download={{generated_file}}>{{generated_file}}</a>
        </p>
        <a style="font-size: 5rem" href="../youtube-dl">🔙</a>
      </main>
    </div>
  </div>

  <script>
  function fetchUntilDone() {
    fetch('q_is_complete?url={{url}}').then(resp => resp.json()).then(resp => {
      if (!resp.complete) {
        setTimeout(fetchUntilDone, 2000);
        return;
      }
      document.getElementById('initial').style.display = 'none';
      document.getElementById('success').style.display = 'block';
    }).catch(error => console.error(error));
  }
  fetchUntilDone();
  </script>

  </body>
</html>
